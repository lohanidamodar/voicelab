# Analyse and test on every push.
#
# Inlined rather than calling popupbits/.github: a reusable workflow in a
# private repository is only callable from the same owner, and this repo lives
# under lohanidamodar/ while that one is a popupbits/ org repo.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: flutter test
